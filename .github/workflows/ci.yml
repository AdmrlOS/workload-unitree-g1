name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/start-unitree-g1 scripts/unitree-g1-status capture/capture-unitree-g1.sh
          python3 -m py_compile scripts/*.py

      - name: Download pinned public inputs
        run: python3 scripts/fetch-unitree-assets.py

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build real arm64 image (CI does not publish)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: unitree-g1-ci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify installed modules and service startup without a robot
        run: |
          set -euo pipefail
          docker run --platform linux/arm64 -d --name smoke unitree-g1-ci:local
          trap 'docker logs smoke || true; docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          # QEMU can take a while to create SSH host keys and start services.
          for i in $(seq 1 90); do
            if docker exec smoke /etc/init.d/master_service status >/dev/null 2>&1 && \
               docker exec smoke /etc/init.d/ota_pipe status >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec smoke /etc/init.d/master_service status
          docker exec smoke /etc/init.d/ota_pipe status
          docker exec smoke jq -e '.Module.unitree_patch_pc4=="1.0.0.6" and .Module.video_hub_pc4=="1.0.1.1"' \
            /unitree/robot/pkg/version/version.json
          docker exec smoke /bin/sh -c 'ldd /unitree/module/video_hub_pc4/videohub_pc4 | grep -q "libddsc.so.0 => /"'
          docker exec smoke /bin/sh -c 'test ! -e /etc/udev/rules.d/70-unitree-realsense-rlsen0.rules'
          docker exec smoke /unitree/sbin/mscli listservice
          # No D435i or NVIDIA multimedia engines on CI: we do not assert
          # actual camera streaming or accelerated GStreamer availability.
