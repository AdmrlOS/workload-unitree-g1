name: Build Clean slate

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false


permissions:
  contents: read
  packages: write

jobs:
  build:
    # Build for the robot architecture natively; no QEMU or runtime tests.
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Unitree inputs
        run: python3 scripts/fetch-unitree-assets.py
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ inputs.publish || false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
